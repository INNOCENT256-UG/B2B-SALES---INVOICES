 <div class="card"><h3>Gross margin % by ${wk?'week':'day'}</h3><div class="ch" style="height:220px"><canvas id="c4"></canvas></div></div>`,

 return{html:`<div class="grid g2"><div class="card"><h3>Top 10 customers: revenue vs gross profit</h3><div class="ch" style="height:360px"><canvas id="c5"></canvas></div></div><div class="card"><h3>Revenue vs margin % (each dot = customer)</h3><div class="ch" style="height:360px"><canvas id="c6"></canvas></div></div></div>${note(`Showing ${num(cr.length)} customers (distinct customer_id) across ${num(agg(rows).inv)} invoices. Top 10 customers = ${(top.reduce((s,x)=>s+x.rev,0)/agg(rows).rev*100).toFixed(1)}% of filtered revenue. Two customer names map to two IDs each; customers are keyed by ID.`)}<div class="card"><h3>Customer table</h3>${T.h}</div>`,

 L=iv.map(x=>x.lag).sort((a,b)=>a-b),avg=L.reduce((s,x)=>s+x,0)/L.length,med=L[Math.floor(L.length/2)],dist=[...groupBy(iv,x=>x.lag)].sort((a,b)=>a[0]-b[0]),od=[...groupBy(iv,x=>x.o)].sort();
